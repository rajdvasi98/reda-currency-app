<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Currency Converter — App Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; }

  .stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }

  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transform: translateX(60px); transition: opacity 0.8s ease, transform 0.8s ease; pointer-events: none; }
  .slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .slide.exit { opacity: 0; transform: translateX(-60px); }

  .badge { display: inline-block; background: linear-gradient(135deg, #6c63ff, #4ecdc4); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 16px; border-radius: 20px; margin-bottom: 18px; }

  .title { color: #fff; font-size: clamp(22px, 3vw, 38px); font-weight: 700; text-align: center; margin-bottom: 10px; text-shadow: 0 2px 20px rgba(108,99,255,0.4); }
  .subtitle { color: #a0a0c0; font-size: clamp(13px, 1.6vw, 17px); text-align: center; max-width: 680px; line-height: 1.6; margin-bottom: 28px; padding: 0 24px; }

  .screen-wrap { position: relative; width: min(88vw, 900px); border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(108,99,255,0.3); }
  .screen-wrap img { width: 100%; display: block; }
  .screen-wrap::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(108,99,255,0.08), transparent); z-index: 1; pointer-events: none; }

  /* top bar chrome */
  .browser-bar { background: #1e1e2e; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; } .dot-y { background: #ffbd2e; } .dot-g { background: #28c840; }
  .url-bar { flex: 1; background: #2a2a3e; border-radius: 6px; padding: 5px 12px; color: #888; font-size: 12px; font-family: monospace; }

  /* nav dots */
  .dots { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; }
  .dot-nav { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.25); cursor: pointer; transition: background 0.3s, transform 0.3s; }
  .dot-nav.active { background: #6c63ff; transform: scale(1.3); }

  /* progress bar */
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #6c63ff, #4ecdc4); width: 0; transition: width 0.1s linear; z-index: 200; }

  /* timer ring */
  .timer { position: fixed; bottom: 24px; right: 24px; }
  svg.ring circle { transition: stroke-dashoffset 0.1s linear; }

  .app-name { position: fixed; top: 20px; left: 24px; color: rgba(255,255,255,0.5); font-size: 13px; letter-spacing: 0.5px; }
  .slide-counter { position: fixed; top: 20px; right: 24px; color: rgba(255,255,255,0.4); font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="progress" id="progressBar"></div>
<div class="app-name">Multi Currency Converter</div>
<div class="slide-counter" id="counter">1 / 4</div>

<div class="stage" id="stage"></div>

<div class="dots" id="dots"></div>

<div class="timer">
  <svg width="36" height="36" viewBox="0 0 36 36" class="ring">
    <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2.5"/>
    <circle id="timerRing" cx="18" cy="18" r="15" fill="none" stroke="#6c63ff" stroke-width="2.5"
      stroke-dasharray="94.25" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 18 18)"/>
  </svg>
</div>

const DURATION = 7000;

let current = 0;
let startTime = null;
let animFrame = null;
let transitioning = false;

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const progressBar = document.getElementById('progressBar');
const timerRing = document.getElementById('timerRing');
const counter = document.getElementById('counter');

// Build slides
const slideEls = SLIDES.map((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  div.innerHTML = `
    <span class="badge">${s.badge}</span>
    <div class="title">${s.title}</div>
    <div class="subtitle">${s.subtitle}</div>
    <div class="screen-wrap">
      <div class="browser-bar">
        <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
        <div class="url-bar">shadow-cod-dev.myshopify.com</div>
      </div>
      <img src="${s.img}" alt="${s.title}" loading="eager">
    </div>
  `;
  stage.appendChild(div);
  return div;
});

// Build nav dots
const dotEls = SLIDES.map((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot-nav' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
  return d;
});

function goTo(idx) {
  if (transitioning || idx === current) return;
  transitioning = true;
  slideEls[current].classList.remove('active');
  slideEls[current].classList.add('exit');
  dotEls[current].classList.remove('active');
  const prev = current;
  current = (idx + SLIDES.length) % SLIDES.length;
  setTimeout(() => { slideEls[prev].classList.remove('exit'); }, 800);
  slideEls[current].classList.add('active');
  dotEls[current].classList.add('active');
  counter.textContent = (current + 1) + ' / ' + SLIDES.length;
  startTime = null;
  setTimeout(() => { transitioning = false; }, 820);
}

function tick(ts) {
  if (!startTime) startTime = ts;
  const elapsed = ts - startTime;
  const pct = Math.min(elapsed / DURATION, 1);

  progressBar.style.width = ((current / SLIDES.length) + pct / SLIDES.length) * 100 + '%';
  timerRing.style.strokeDashoffset = 94.25 * (1 - pct);

  if (elapsed >= DURATION) {
    goTo((current + 1) % SLIDES.length);
  }

  animFrame = requestAnimationFrame(tick);
}

requestAnimationFrame(tick);

// keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') goTo((current + 1) % SLIDES.length);
  if (e.key === 'ArrowLeft') goTo((current - 1 + SLIDES.length) % SLIDES.length);
});

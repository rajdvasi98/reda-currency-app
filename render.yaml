# Render blueprint for the app server (free web service).
# The database is an external PostgreSQL (Neon free tier, no expiry): set DATABASE_URL to its
# connection string in the Render dashboard. Render's own free PostgreSQL expires after 30 days.
services:
  - type: web
    name: reda-currency-app
    runtime: node
    plan: free
    buildCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: HOST
        sync: false

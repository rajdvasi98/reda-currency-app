services:
  - type: web
    name: multi-currency-converter
    env: node
    plan: starter
    buildCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /data/database.sqlite
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,read_script_tags,write_script_tags
      - key: HOST
        sync: false

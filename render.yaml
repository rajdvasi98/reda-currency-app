databases:
  - name: currency-db
    plan: free
    databaseName: currency_app
    user: currency_user

services:
  - type: web
    name: multi-currency-converter
    env: node
    plan: starter
    buildCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: currency-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products
      - key: HOST
        sync: false
